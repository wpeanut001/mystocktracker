<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭股票與 ETF 投資組合資產庫</title>
  <style>
    body { font-family: 'Segoe UI', Microsoft JhengHei, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 1150px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { text-align: center; color: #0f172a; margin-bottom: 20px; font-size: 24px; }
    .tabs { display: flex; justify-content: center; margin-bottom: 20px; }
    .tab-btn { padding: 10px 25px; border: none; cursor: pointer; font-size: 16px; background-color: #e2e8f0; margin: 0 6px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
    .tab-btn.active { background-color: #2563eb; color: white; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
    
    .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; background: #f8fafc; padding: 18px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #e2e8f0; text-align: center; }
    .dash-item { background: white; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .dash-title { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .dash-value { font-size: 18px; font-weight: bold; color: #0f172a; }
    .dash-value.highlight { color: #16a34a; font-size: 20px; }

    .section-title { font-size: 16px; font-weight: bold; margin: 25px 0 10px 0; color: #334155; display: flex; align-items: center; gap: 8px; }
    .form-group { display: flex; flex-wrap: wrap; gap: 10px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
    input, select, button { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    input[type="text"] { flex: 2; min-width: 200px; }
    button.submit-btn { background-color: #16a34a; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; font-size: 15px; }
    button.submit-btn:hover { background-color: #15803d; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: white; font-size: 13.5px; }
    th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background-color: #1e293b; color: white; font-weight: 600; white-space: nowrap; }
    tr:nth-child(even) { background-color: #f8fafc; }

    .delete-btn { background-color: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .delete-btn:hover { background-color: #dc2626; }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 我們的股票與 ETF 投資組合資產庫</h1>
  
  <div class="tabs">
    <button class="tab-btn active" id="btnHusband" onclick="switchUser('老公')">👨 老公的帳戶</button>
    <button class="tab-btn" id="btnWife" onclick="switchUser('老婆')">👩 老婆的帳戶</button>
  </div>

  <div class="dashboard">
    <div class="dash-item">
      <div class="dash-title">總投入成本</div>
      <div class="dash-value">$<span id="totalCost">0</span></div>
    </div>
    <div class="dash-item">
      <div class="dash-title">預估年領股息</div>
      <div class="dash-value">$<span id="totalDividend">0</span></div>
    </div>
    <div class="dash-item">
      <div class="dash-title">平均月領被動收入</div>
      <div class="dash-value highlight">$<span id="monthlyDividend">0</span></div>
    </div>
    <div class="dash-item">
      <div class="dash-title">平均預估殖利率</div>
      <div class="dash-value"><span id="yieldRate">0</span> %</div>
    </div>
  </div>

  <div class="section-title">➕ 新增買進交易紀錄 (支援全台股/ETF 搜尋)</div>
  <form id="stockForm" class="form-group">
    <input type="text" id="stockId" list="stockList" placeholder="搜尋全台股名稱或代碼 (如: 2330, 00918, 聯發科)" required autocomplete="off">
    <datalist id="stockList"></datalist>
    
    <input type="number" id="shares" placeholder="股數/張數" required style="width: 90px;" min="1">
    <select id="unit">
      <option value="1">股</option>
      <option value="1000">張</option>
    </select>
    
    <input type="number" id="price" placeholder="買進單價" step="0.01" required style="width: 100px;">
    <input type="date" id="date" required>
    
    <button type="submit" class="submit-btn">儲存交易紀錄</button>
  </form>

  <div class="section-title">📌 個股持股與配息總覽 (全台股 API 動態試算)</div>
  <table>
    <thead>
      <tr>
        <th>代碼</th>
        <th>標的名稱</th>
        <th>持股數</th>
        <th>平均成本</th>
        <th>最近一次配息</th>
        <th>推估年配息(每股)</th>
        <th>年配總額</th>
        <th>平均月配</th>
      </tr>
    </thead>
    <tbody id="summaryTable">
      <!-- 總覽表格資料 -->
    </tbody>
  </table>

  <div class="section-title">📜 歷史交易紀錄細項</div>
  <table>
    <thead>
      <tr>
        <th>買進日期</th>
        <th>標的名稱</th>
        <th>成交股數</th>
        <th>買進單價</th>
        <th>總投入成本</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="recordTable">
      <!-- 歷史紀錄資料 -->
    </tbody>
  </table>
</div>

<script>
  const API_BASE_URL = "https://myrespond.wpeanut001.workers.dev";
  let currentUser = '老公';
  let allStockMap = {}; // 用於全台股代碼與名稱對照

  document.getElementById('date').valueAsDate = new Date();

  // 1. 自動從 FinMind 載入全台灣上市、上櫃股票與 ETF 清單
  async function initAllTaiwanStockList() {
    try {
      const res = await fetch('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo');
      const data = await res.json();
      if (data.data) {
        const datalist = document.getElementById('stockList');
        datalist.innerHTML = '';
        data.data.forEach(item => {
          allStockMap[item.stock_id] = item.stock_name;
          const option = document.createElement('option');
          option.value = `${item.stock_id} ${item.stock_name}`;
          datalist.appendChild(option);
        });
      }
    } catch (e) {
      console.warn("全台股清單載入失敗，採用動態解析機制", e);
    }
  }

  function switchUser(user) {
    currentUser = user;
    document.getElementById('btnHusband').classList.toggle('active', user === '老公');
    document.getElementById('btnWife').classList.toggle('active', user === '老婆');
    loadRecords();
  }

  // 新增交易紀錄
  document.getElementById('stockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const stockInput = document.getElementById('stockId').value.trim();
    const stockCode = stockInput.split(' ')[0];
    const shares = parseInt(document.getElementById('shares').value) * parseInt(document.getElementById('unit').value);
    const price = parseFloat(document.getElementById('price').value);
    const date = document.getElementById('date').value;

    try {
      const res = await fetch(`${API_BASE_URL}/api/transactions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: currentUser, stockId: stockInput, stockCode: stockCode, shares: shares, price: price, date: date })
      });

      if (res.ok) {
        document.getElementById('stockForm').reset();
        document.getElementById('date').valueAsDate = new Date();
        loadRecords();
      }
    } catch (e) {
      alert("儲存錯誤：" + e.message);
    }
  });

  // 載入資料並計算
  async function loadRecords() {
    const summaryTbody = document.getElementById('summaryTable');
    const recordTbody = document.getElementById('recordTable');
    summaryTbody.innerHTML = '<tr><td colspan="8">🔍 正在向 API 查詢全台股最新歷史公告配息...</td></tr>';
    recordTbody.innerHTML = '';

    try {
      const res = await fetch(`${API_BASE_URL}/api/transactions?user=${encodeURIComponent(currentUser)}`);
      const records = await res.json();

      let stockMap = {};
      let grandTotalCost = 0;
      let grandTotalAnnualDiv = 0;

      if (records.length === 0) {
        summaryTbody.innerHTML = '<tr><td colspan="8">尚無持股資料</td></tr>';
        recordTbody.innerHTML = '<tr><td colspan="6">尚無交易細項紀錄</td></tr>';
      } else {
        records.forEach(data => {
          const code = data.stockCode || data.stockId.split(' ')[0];
          
          // 歷史紀錄細項
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${data.date}</td>
            <td><strong>${data.stockId}</strong></td>
            <td>${data.shares.toLocaleString()} 股</td>
            <td>$${data.price}</td>
            <td>$${Math.round(data.total).toLocaleString()}</td>
            <td><button class="delete-btn" onclick="deleteRecord(${data.id})">🗑️ 刪除</button></td>
          `;
          recordTbody.appendChild(tr);

          // 個股持股合併
          if (!stockMap[code]) {
            stockMap[code] = { code: code, fullName: data.stockId, totalShares: 0, totalCost: 0 };
          }
          stockMap[code].totalShares += data.shares;
          stockMap[code].totalCost += data.total;
        });

        summaryTbody.innerHTML = '';
        
        for (const code of Object.keys(stockMap)) {
          const item = stockMap[code];
          const avgCost = (item.totalCost / item.totalShares).toFixed(2);
          const stockName = allStockMap[code] || item.fullName.split(' ')[1] || item.fullName;
          
          let lastDiv = 0;
          let perShareAnnual = 0;

          // 動態呼叫 API 抓取全台股/ETF 配息
          try {
            const divRes = await fetch(`${API_BASE_URL}/api/dividend?code=${code}`);
            const divData = await divRes.json();
            if (divData.success) {
              lastDiv = divData.lastDiv || 0;
              perShareAnnual = divData.annualEstimate || 0;
            }
          } catch (err) {
            console.warn(`[${code}] API 抓取失敗`, err);
          }

          const annualTotal = Math.round(item.totalShares * perShareAnnual);
          const monthlyDiv = Math.round(annualTotal / 12); // 年配總額 ÷ 12 得到平均月配

          grandTotalCost += item.totalCost;
          grandTotalAnnualDiv += annualTotal;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${code}</strong></td>
            <td>${stockName}</td>
            <td>${item.totalShares.toLocaleString()}</td>
            <td>$${avgCost}</td>
            <td><strong>$${Number(lastDiv).toFixed(2)}</strong></td>
            <td>$${Number(perShareAnnual).toFixed(2)}</td>
            <td><strong>$${annualTotal.toLocaleString()}</strong></td>
            <td>$${monthlyDiv.toLocaleString()}</td>
          `;
          summaryTbody.appendChild(tr);
        }
      }

      // 更新頂部卡片數據
      document.getElementById('totalCost').innerText = Math.round(grandTotalCost).toLocaleString();
      document.getElementById('totalDividend').innerText = Math.round(grandTotalAnnualDiv).toLocaleString();
      document.getElementById('monthlyDividend').innerText = Math.round(grandTotalAnnualDiv / 12).toLocaleString();
      const yieldRate = grandTotalCost > 0 ? ((grandTotalAnnualDiv / grandTotalCost) * 100).toFixed(2) : 0;
      document.getElementById('yieldRate').innerText = yieldRate;

    } catch (e) {
      summaryTbody.innerHTML = `<tr><td colspan="8" style="color:red;">載入失敗：${e.message}</td></tr>`;
    }
  }

  // 刪除紀錄
  async function deleteRecord(id) {
    if (confirm("確定要刪除這筆買進紀錄嗎？")) {
      try {
        const res = await fetch(`${API_BASE_URL}/api/transactions?id=${id}`, { method: 'DELETE' });
        if (res.ok) loadRecords();
      } catch (e) {
        alert("刪除失敗：" + e.message);
      }
    }
  }

  initAllTaiwanStockList();
  loadRecords();
</script>

</body>
</html>
