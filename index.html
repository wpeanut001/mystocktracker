<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭股票與 ETF 記帳本</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
    .status-badge { text-align: center; font-size: 12px; color: #27ae60; margin-bottom: 20px; font-weight: bold; }
    .tabs { display: flex; justify-content: center; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; background-color: #e0e0e0; margin: 0 5px; border-radius: 5px; transition: 0.3s; }
    .tab-btn.active { background-color: #3498db; color: white; font-weight: bold; }
    .dashboard { display: flex; justify-content: space-around; background: #e8f8f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; border: 1px solid #a3e4d7; }
    .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: #ecf0f1; padding: 15px; border-radius: 8px; }
    input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    input[type="text"] { flex: 2; min-width: 200px; }
    button.submit-btn { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button.submit-btn:hover { background-color: #2ecc71; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
    th { background-color: #34495e; color: white; }
    .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    .loading-text { font-size: 11px; color: #7f8c8d; }
  </style>
</head>
<body>

<div class="container">
  <h1>📈 我們的股票與 ETF 記帳本</h1>
  <div class="status-badge" id="apiStatus">🔄 系統連線中：官方清單與 FinMind API 配息自動串接...</div>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchUser('老公')">👨 老公的帳戶</button>
    <button class="tab-btn" onclick="switchUser('老婆')">👩 老婆的帳戶</button>
  </div>

  <div class="dashboard">
    <div>總投入成本: <span id="totalCost">0</span> 元</div>
    <div>推估年領股息: <span id="totalDividend">0</span> 元</div>
    <div>推估殖利率: <span id="yieldRate">0</span> %</div>
  </div>

  <form id="stockForm" class="form-group">
    <input type="text" id="stockId" list="stockList" placeholder="輸入股號或名稱 (如: 00918, 2330)" required autocomplete="off">
    <datalist id="stockList">
      <!-- 官方股票資料動態載入 -->
    </datalist>
    
    <input type="number" id="shares" placeholder="數量" required style="width: 80px;">
    <select id="unit">
      <option value="1">股</option>
      <option value="1000">張</option>
    </select>
    
    <input type="number" id="price" placeholder="成交價" step="0.01" required style="width: 100px;">
    <input type="date" id="date" required>
    
    <button type="submit" class="submit-btn" id="submitBtn">新增交易紀錄</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>標的名稱</th>
        <th>股數</th>
        <th>買進價</th>
        <th>總成本</th>
        <th>預估股息 (API自動抓取)</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="recordTable">
      <!-- 資料會從 Firebase 載入 -->
    </tbody>
  </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJFFmw1HsgEueMDKNV0ClApe5ouQC5nl8",
    authDomain: "mystocktracker-2f29e.firebaseapp.com",
    projectId: "mystocktracker-2f29e",
    storageBucket: "mystocktracker-2f29e.firebasestorage.app",
    messagingSenderId: "1013155456946",
    appId: "1:1013155456946:web:6c8432cf824600879266ab"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentUser = '老公';
  document.getElementById('date').valueAsDate = new Date();

  // 1. 自動向開放資料庫抓取全台股與 ETF 清單
  async function fetchStockList() {
    try {
      const response = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
      const data = await response.json();
      const datalist = document.getElementById('stockList');
      datalist.innerHTML = '';
      
      data.forEach(item => {
        const option = document.createElement('option');
        option.value = `${item.Code} ${item.Name}`;
        datalist.appendChild(option);
      });
      document.getElementById('apiStatus').innerText = `✅ 已成功連線官方資料庫 (含 ${data.length} 檔標的)`;
    } catch (err) {
      document.getElementById('apiStatus').innerText = "⚠️ 選單載入受限，仍可直接手動輸入任何股號";
    }
  }

  // 2. 自動向 FinMind API 查詢單一股票/ETF 的最新歷史配息
  async function fetchDividendFromAPI(stockCode) {
    try {
      const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockDividend&data_id=${stockCode}`;
      const response = await fetch(url);
      const resData = await response.json();

      if (resData.data && resData.data.length > 0) {
        // 抓取最新一筆配息資料
        const latest = resData.data[resData.data.length - 1];
        const cash = parseFloat(latest.CashEarningsDistribution || 0) + parseFloat(latest.CashStatutorySurplus || 0);
        const stock = parseFloat(latest.StockEarningsDistribution || 0);
        return { cashDiv: cash, stockDiv: stock };
      }
    } catch (e) {
      console.warn("FinMind API 查詢配息失敗，使用估計值", e);
    }
    return null; // 若抓不到則傳回 null，由後續機制自動估算
  }

  // 切換使用者
  window.switchUser = function(user) {
    currentUser = user;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    loadRecords();
  };

  // 提交新增紀錄
  document.getElementById('stockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = "🔍 正在向 API 查詢最新配息中...";
    submitBtn.disabled = true;

    const stockInput = document.getElementById('stockId').value;
    const stockCode = stockInput.split(' ')[0]; // 提取股號
    const shares = parseInt(document.getElementById('shares').value) * parseInt(document.getElementById('unit').value);
    const price = parseFloat(document.getElementById('price').value);
    const date = document.getElementById('date').value;

    // 自動向 FinMind API 抓取配息
    let apiDivData = await fetchDividendFromAPI(stockCode);

    try {
      await addDoc(collection(db, "transactions"), {
        user: currentUser,
        stockId: stockInput,
        stockCode: stockCode,
        shares: shares,
        price: price,
        total: shares * price,
        date: date,
        apiCashDiv: apiDivData ? apiDivData.cashDiv : null,
        apiStockDiv: apiDivData ? apiDivData.stockDiv : null,
        timestamp: new Date()
      });

      document.getElementById('stockForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      loadRecords();
    } catch (e) {
      alert("儲存失敗：" + e);
    } finally {
      submitBtn.innerText = "新增交易紀錄";
      submitBtn.disabled = false;
    }
  });

  // 載入資料庫紀錄並計算
  async function loadRecords() {
    const q = query(collection(db, "transactions"), where("user", "==", currentUser));
    const querySnapshot = await getDocs(q);
    const tbody = document.getElementById('recordTable');
    tbody.innerHTML = '';
    
    let totalCostAcc = 0;
    let totalDivAcc = 0;

    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;

      // 優先使用 Fin
